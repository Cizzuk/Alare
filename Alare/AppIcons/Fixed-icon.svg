      <use href="#dot" transform="rotate(0 100 29)"/>
    </g>
    <g transform="rotate(30 100 100)">
      <use href="#dot" transform="rotate(-30 100 29)"/>
    </g>
    <g transform="rotate(60 100 100)">
      <use href="#dot" transform="rotate(-60 100 29)"/>
    </g>
    <g transform="rotate(90 100 100)">
      <use href="#dot" transform="rotate(-90 100 29)"/>
    </g>
    <g transform="rotate(120 100 100)">
      <use href="#dot" transform="rotate(-120 100 29)"/>
    </g>
    <g transform="rotate(150 100 100)">
      <use href="#dot" transform="rotate(-150 100 29)"/>
    </g>
    <g transform="rotate(180 100 100)">
      <use href="#dot" transform="rotate(-180 100 29)"/>
    </g>
    <g transform="rotate(210 100 100)">
      <use href="#dot" transform="rotate(-210 100 29)"/>
    </g>
    <g transform="rotate(240 100 100)">
      <use href="#dot" transform="rotate(-240 100 29)"/>
    </g>
    <g transform="rotate(270 100 100)">
      <use href="#dot" transform="rotate(-270 100 29)"/>
